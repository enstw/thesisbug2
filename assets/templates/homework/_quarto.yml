project:
  type: default
  output-dir: _output
  render:
    - homework.qmd

title: "[作業標題]"
author: "[作者]"
date: "[日期]"

format:
  pdf:
    documentclass: article
    pdf-engine: xelatex
    papersize: a4
    include-in-header:
      - {{FW}}/assets/templates/homework/preamble.tex
    toc: false
    number-sections: false
    colorlinks: true
    linkcolor: black
    urlcolor: blue

lang: zh-TW

# Quarto ships interface strings for zh (Simplified) only; zh-Hant and zh-TW fall
# back to them — 目錄 prints as 「目录」, 圖 as 「图」. lang: zh-TW also selects the
# zh-TW citeproc locale (頁／等／編) instead of zh-CN's 页／等／编. The strings a PDF
# shows are overridden here in Traditional Chinese; the title-block and
# copy-button ones are what the HTML report (html.yml) adds.
language:
  title-block-author-single: "作者"
  title-block-author-plural: "作者"
  title-block-published: "日期"
  copy-button-tooltip: "複製"
  copy-button-tooltip-success: "已複製"
  toc-title-document: "目錄"
  crossref-fig-title: "圖"
  crossref-tbl-title: "表"
  crossref-fig-prefix: "圖 %s"
  crossref-tbl-prefix: "表 %s"
  crossref-sec-prefix: "第 %s 節"
  crossref-eq-prefix: "式 %s"
  crossref-lst-title: "程式"
  section-title-abstract: "摘要"
  section-title-references: "參考文獻"
  section-title-appendices: "附錄"
  section-title-footnotes: "註腳"
  callout-note-title: "備註"
  callout-tip-title: "提示"
  callout-warning-title: "警告"
  callout-important-title: "重要"
  callout-caution-title: "注意"
