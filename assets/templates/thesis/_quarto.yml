project:
  type: book
  output-dir: _output

book:
  title: "[論文主標題]"
  subtitle: "[副標題]"
  author: "[作者]"
  date: "[日期]"
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-literature-review.qmd
    - chapters/03-methodology.qmd
    - chapters/04-analysis.qmd
    - chapters/05-conclusion.qmd
    - references.qmd

bibliography: references.bib

# Citation style — APA 7th (automatic, single alphabetical reference list),
# matching the YAML documented in writing-protocol.md.
csl: {{FW}}/assets/apa.csl
lang: zh-Hant

format:
  pdf:
    documentclass: book
    pdf-engine: xelatex
    papersize: a4
    include-in-header:
      - {{FW}}/assets/templates/thesis/preamble.tex
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: black
    urlcolor: blue
    citecolor: black
