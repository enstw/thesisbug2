<head>
<meta charset="UTF-8" />

<style>
  :root {
    --ui-bg: #090c15;
    --ui-sidebar: #0f1422;
    --ui-border: rgba(255, 255, 255, 0.12);
    --ui-text: #e2e8f0;
    --ui-muted: #94a3b8;
    --ui-accent: #38bdf8;
    --ui-panel: #161c2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--ui-bg); color: var(--ui-text);
    font-family: var(--font, system-ui, sans-serif);
    display: flex; height: 100vh; overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 320px; background: var(--ui-sidebar);
    border-right: 1px solid var(--ui-border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px 24px; border-bottom: 1px solid var(--ui-border);
  }
  .sidebar-header h1 {
    font-size: 20px; margin: 0 0 4px; color: #fff; display: flex; align-items: center; gap: 8px;
  }
  .sidebar-header p {
    font-size: 13px; margin: 0; color: var(--ui-muted);
  }
  .search-box {
    padding: 12px 18px; border-bottom: 1px solid var(--ui-border);
  }
  .search-box input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--ui-border);
    color: #fff; font-size: 13px; outline: none;
  }
  .search-box input:focus { border-color: var(--ui-accent); }
  .layout-list {
    flex: 1; overflow-y: auto; padding: 12px 0;
  }
  .family-group {
    margin-bottom: 16px;
  }
  .family-title {
    padding: 6px 20px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--ui-muted); text-transform: uppercase;
  }
  .layout-item {
    padding: 10px 20px; display: flex; flex-direction: column; gap: 2px;
    cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent;
  }
  .layout-item:hover { background: rgba(255,255,255,0.04); }
  .layout-item.active {
    background: rgba(56, 189, 248, 0.12);
    border-left-color: var(--ui-accent);
  }
  .layout-item .code {
    font-size: 13px; font-weight: 700; color: #fff; font-family: monospace;
  }
  .layout-item .name {
    font-size: 12px; color: var(--ui-muted);
  }
  .layout-item.active .code { color: var(--ui-accent); }

  /* Main Workspace */
  #main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .toolbar {
    padding: 12px 24px; background: var(--ui-sidebar);
    border-bottom: 1px solid var(--ui-border);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; flex-shrink: 0;
  }
  .controls-group {
    display: flex; align-items: center; gap: 12px;
  }
  .label-tag {
    font-size: 12px; color: var(--ui-muted); font-weight: 600; text-transform: uppercase;
  }
  .seg-btn-group {
    display: inline-flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 2px; border: 1px solid var(--ui-border);
  }
  .seg-btn {
    padding: 6px 12px; font-size: 12px; border: none; background: transparent;
    color: var(--ui-muted); cursor: pointer; border-radius: 6px; transition: all 0.15s;
  }
  .seg-btn:hover { color: #fff; }
  .seg-btn.active {
    background: var(--ui-accent); color: #000; font-weight: 700;
  }

  .select-theme {
    padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.06);
    border: 1px solid var(--ui-border); color: #fff; font-size: 13px; outline: none; cursor: pointer;
  }
  .action-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--ui-border);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s;

  .action-btn:hover { background: rgba(255,255,255,0.12); }
  .action-btn.primary { background: var(--ui-accent); color: #000; border-color: var(--ui-accent); }
  .action-btn.primary:hover { filter: brightness(1.1); }

  /* Stage Container */
  .stage-wrapper {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; padding: 24px; position: relative; overflow: hidden;
  }
  .stage-scaler {
    width: 1920px; height: 1080px; transform-origin: center center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    position: relative; flex-shrink: 0;
  }
  .stage-scaler .slide {
    width: 100%; height: 100%; position: absolute; inset: 0;
  }

  /* Bottom Code / Snippet Bar */
  .code-drawer {
    height: 180px; background: var(--ui-sidebar);
    border-top: 1px solid var(--ui-border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .drawer-header {
    padding: 8px 24px; border-bottom: 1px solid var(--ui-border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-title {
    font-size: 12px; font-weight: 700; color: var(--ui-muted); display: flex; align-items: center; gap: 8px;
  }
  .drawer-content {
    flex: 1; overflow: auto; padding: 12px 24px; background: #07090f;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px; line-height: 1.5; color: #cbd5e1; white-space: pre-wrap; margin: 0;
  }
  .toast {
    position: fixed; right: 24px; top: 24px; background: #10b981; color: #fff;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); opacity: 0; transform: translateY(-10px);
    transition: all 0.2s; pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>

// State
let activeLayout = CATALOG[0];
let activeVariant = activeLayout.variants[0];
let activeAccent = "var(--c1)";

// Elements
const listEl = document.getElementById("layout-list");
const variantGroupEl = document.getElementById("variant-group");
const accentGroupEl = document.getElementById("accent-group");
const slideContainerEl = document.getElementById("slide-container");
const codeSnippetEl = document.getElementById("code-snippet");
const stageScalerEl = document.getElementById("stage-scaler");
const stageWrapperEl = document.getElementById("stage-wrapper");
const themeSelectEl = document.getElementById("theme-select");
const toastEl = document.getElementById("toast");

// Responsive 16:9 Scaler
function resizeStage() {
  const wrapperRect = stageWrapperEl.getBoundingClientRect();
  const pad = 32;
  const availW = wrapperRect.width - pad;
  const availH = wrapperRect.height - pad;
  const scale = Math.min(availW / 1920, availH / 1080);
  stageScalerEl.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", resizeStage);

// Render Layout List in Sidebar
function renderSidebar(items) {
  listEl.innerHTML = "";
  const groups = {};
  items.forEach(item => {
    if (!groups[item.family]) groups[item.family] = [];
    groups[item.family].push(item);
  });

  for (const [family, groupItems] of Object.entries(groups)) {
    const groupEl = document.createElement("div");
    groupEl.className = "family-group";
    groupEl.innerHTML = `<div class="family-title">${family}</div>`;

    groupItems.forEach(item => {
      const itemEl = document.createElement("div");
      itemEl.className = `layout-item ${item.id === activeLayout.id ? "active" : ""}`;
      itemEl.innerHTML = `
        <span class="code">${item.id}</span>
        <span class="name">${item.name}</span>
      `;
      itemEl.addEventListener("click", () => selectLayout(item));
      groupEl.appendChild(itemEl);
    });

    listEl.appendChild(groupEl);
  }
}

// Select Layout
function selectLayout(layout) {
  activeLayout = layout;
  activeVariant = layout.variants[0];
  renderSidebar(CATALOG);
  updateVariantButtons();
  updateStage();
}

// Update Variant Buttons
function updateVariantButtons() {
  variantGroupEl.innerHTML = "";
  activeLayout.variants.forEach(v => {
    const btn = document.createElement("button");
    btn.className = `seg-btn ${v === activeVariant ? "active" : ""}`;
    btn.textContent = v;
    btn.addEventListener("click", () => {
      activeVariant = v;
      updateVariantButtons();
      updateStage();
    });
    variantGroupEl.appendChild(btn);
  });
}

// Update Stage & Snippet
function updateStage() {
  slideContainerEl.innerHTML = activeLayout.render(activeVariant, activeAccent);
  codeSnippetEl.textContent = activeLayout.snippet;

  // Re-trigger entrance animation
  const slide = slideContainerEl.querySelector(".slide");
  if (slide) {
    slide.removeAttribute("data-deck-active");
    void slide.offsetWidth;
    slide.setAttribute("data-deck-active", "");
  }
}

// Replay Animation
document.getElementById("replay-btn").addEventListener("click", () => {
  const slide = slideContainerEl.querySelector(".slide");
  if (slide) {
    slide.removeAttribute("data-deck-active");
    void slide.offsetWidth;
    slide.setAttribute("data-deck-active", "");
  }
});

// Accent Buttons
accentGroupEl.querySelectorAll(".seg-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    accentGroupEl.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeAccent = btn.dataset.accent;
    updateStage();
  });
});

// Theme Select
themeSelectEl.addEventListener("change", (e) => {
  document.documentElement.setAttribute("data-deck-theme-default", e.target.value);
});

// Copy to Clipboard
function copySnippet() {
  navigator.clipboard.writeText(activeLayout.snippet).then(() => {
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2000);
  });
}
document.getElementById("copy-btn").addEventListener("click", copySnippet);
document.getElementById("drawer-copy-btn").addEventListener("click", copySnippet);

// Search Filtering
document.getElementById("filter-input").addEventListener("input", (e) => {
  const query = e.target.value.toLowerCase().trim();
  const filtered = CATALOG.filter(item =>
    item.id.toLowerCase().includes(query) || item.name.toLowerCase().includes(query)
  );
  renderSidebar(filtered);
});

// Init
renderSidebar(CATALOG);
updateVariantButtons();
updateStage();
resizeStage();
</script>
